  unit_description: One to three consecutive paragraphs (40 to 300 words) from one chapter of a public-domain
    English novel.
  how_gold_was_made: University-level literature students annotated every quotation in each full novel;
    each novel was annotated by two annotators who then resolved all disagreements in up to three consensus
    rounds (paper section 4.2). Quotations were pre-identified with GutenTag and checked by the annotators.
    Gold items here are those quotation spans copied verbatim at PDNC's own character offsets.
  known_issues:
  - An interrupted quotation ("A," said X, "B.") is ONE PDNC quotation with two sub-spans; it is one gold
    item whose text is the sub-spans joined by a space, with each sub-span as an evidence span (flag interrupted_quote).
    meta.n_subquote_spans gives the count if fragments are scored separately.
  - Speech reported without quote marks (free indirect speech) is not annotated as a quotation and is
    not detected; a model may list it.
  - 'PDNC''s novel_text.txt files contain no characters above ASCII: em dashes, curly apostrophes and
    ligatures were dropped or turned into spaces by PDNC, so some words read oddly (''I m going'', ''antenn
    '', ''Hastings it''s''). Units copy this text verbatim because PDNC''s offsets index it.'
  - n = 0 windows that contain a speech verb (said, asked ...) are flagged speech_verb_no_quote_marks;
    in the ones read these were indirect speech, which is correctly not a quotation.
  - 'n = 0 windows are longer (median 113 words) than n = 1-3 windows (82-84 words): narration paragraphs
    are long.'
  - Quote marks are excluded from gold text, matching PDNC's spans.
  - Windows containing any double-quote character not covered by a PDNC annotation are dropped, so scare
    quotes, quoted titles, letters and missed quotations never appear; this removes a slice of real text.
  - Some texts keep Project Gutenberg underscore italics (_word_); kept verbatim (flag gutenberg_underscore_italics).
  - Identical quotations in one window (for example two characters saying "No.") are merged (flag gold_dedup),
    so n counts distinct quote strings.
  - A Handful of Dust (1934) is excluded because its text is not public domain in the US.
  - Seven novels are US public domain but may still be in copyright in life+70 countries (flag text_copyright_outside_us_until:<year>).
