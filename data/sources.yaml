ami:
  title: 'AMI Meeting Corpus (manual annotations 1.6.2 / release 1.7): abstractive summaries'
  domain: meeting_notes
  list_types:
  - action_items
  - decisions
  url: https://groups.inf.ed.ac.uk/ami/corpus/
  paper: 'Carletta et al. 2005, The AMI Meeting Corpus: A Pre-Announcement, MLMI 2005 (LNCS 3869)'
  licence: CC-BY-4.0
  licence_url: https://groups.inf.ed.ac.uk/ami/corpus/license.shtml
  licence_quote: The AMI corpus and its annotations are released under the Creative Commons Attribution
    4.0 International Public License agreement (CC BY 4.0).
  redistributable: true
  files:
  - url: https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip
    sha256: b56e5babb2496b8795deeeda7e71178d7fbc9963f94276cf2a3f4b56ebbc9f9d
    path: ami_public_manual_1.6.2.zip
  unit_description: A window of one AMI meeting transcript (one speaker turn per line, verbatim words)
    cut around a known number of annotator-summarised action items or decisions.
  how_gold_was_made: One AMI annotator per meeting wrote an abstractive summary with ACTIONS and DECISIONS
    sections ('Name the next steps that each member of the group will take until the next meeting'; 'Name
    all decisions that were made during the meeting'), writing NA for an empty section, and then linked
    each summary sentence to the dialogue acts it summarises. No reliability figure was published.
  known_issues:
  - One annotator per meeting and no published agreement; minor or implicit commitments can be missing.
  - A gold sentence can bundle several assignees or decisions; n counts sentences, not tasks.
  - Action links cluster in the wrap-up at the end of the meeting; meta.rel_position records window position.
  - Meetings whose annotator wrote NA under ACTIONS are mostly final ('d') meetings of a series, so n=0
    action windows over-represent end-of-project talk.
  - Scenario meetings are a role-play (designing a TV remote), so items are templated ('X will work on
    Y').
  - Overlapping speech is serialised by dialogue-act start time.
