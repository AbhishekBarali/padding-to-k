  unit_description: One whole English customer review (food product, online course, hotel or phone), 15
    to 400 words, as tokenised in the ROAST quads files.
  how_gold_was_made: Two Upwork annotators labelled every opinion in each full review as a quadruple (target,
    aspect category, sentiment, opinion phrase) in BRAT, following a guideline written for the task; implicit
    targets were written as NULL. Disagreements in a 50-review pilot were resolved jointly, 10 of every
    50 reviews were cross-checked, and quadruple-level agreement was about 78% F1. Gold items here are
    the distinct non-NULL targets, located in the text by exact match.
  known_issues:
  - Only targets of an expressed opinion are annotated; a feature mentioned neutrally (no opinion) is
    not a gold item.
  - Text is pre-tokenised by the dataset (spaces around punctuation, "don ' t"); it is kept as is.
  - n = 0 reviews almost always still hold opinions with an implicit target (the product or course as
    'it'), so they are weak zeros (flag n0_weak).
  - Amazon_FF targets are often normalised to the product name rather than the specific feature, so a
    feature the review praises may be folded into one product target.
  - Some lines join several paragraphs with no space ("cleanBreakfast") and some hotel texts carry mojibake
    from mis-decoded quotes; both are flagged.
  - A few amazon_ff lines appear to hold two concatenated reviews with only the first annotated; units
    whose last annotation ends long before the text does are flagged.
  - Targets can be pronoun-like or generic words ('it' is not used, but 'product', 'course', 'hotel' are
    common gold items).
  - 638 review texts appear two or more times in the release (often in different splits) with separately
    made annotations; copies naming the same targets are kept once (flag duplicate_in_source_same_targets),
    copies that disagree are all dropped.
  - Some texts lost the first letter of a sentence ('he hotel', 'his is'); flagged maybe_dropped_initial_chars,
    text left as is.
skillspan:
  title: 'SkillSpan: Hard and Soft Skill Extraction from English Job Postings'
  domain: job_posts
  list_types:
  - skills
  - knowledge
  url: https://github.com/kris927b/SkillSpan
  paper: 'Zhang, Jensen, Sonniks and Plank (2022). SkillSpan: Hard and Soft Skill Extraction from English
    Job Postings. NAACL 2022, ACL Anthology 2022.naacl-main.366, arXiv 2204.12811.'
  licence: CC-BY-4.0
  licence_url: https://huggingface.co/datasets/jjzha/skillspan
  licence_quote: 'HF dataset card (author Mike Zhang) front matter: "license: cc-by-4.0". GitHub repo
    LICENSE: "MIT License, Copyright (c) 2023 Mike Zhang" (https://github.com/kris927b/SkillSpan/blob/main/LICENSE).
    Paper Sec. 4: "We release the anonymized raw data and annotations of the parts with permissible licenses,
    i.e., HOUSE ... and TECH"; Appendix A: "The job posting data in TECH is from Stackoverflow jobs, and
    is licensed under the CC BY-SA license."'
  redistributable: true
  files:
  - url: https://raw.githubusercontent.com/kris927b/SkillSpan/2ccf3de5b5af7a5409b8dd814fb1315dd6e0ae1b/data/json/train.json
    sha256: 5e884c3426087d14fc437d328eb72132082edbfe1e776292ae0e6e9b36c1e1f6
    path: data/json/train.json
  - url: https://raw.githubusercontent.com/kris927b/SkillSpan/2ccf3de5b5af7a5409b8dd814fb1315dd6e0ae1b/data/json/dev.json
    sha256: 3732937c6869fe191c749b4efe7ffd597ce84eea1192f09b7fe3bd1eb459e2b4
    path: data/json/dev.json
  - url: https://raw.githubusercontent.com/kris927b/SkillSpan/2ccf3de5b5af7a5409b8dd814fb1315dd6e0ae1b/data/json/test.json
    sha256: 8438eda34939a5877b984ea5daf9e6ff39b2d5c7e3d73cca0499d3de3784d24a
    path: data/json/test.json
  unit_description: A window of 4 to 10 consecutive sentences (60 to 300 words) from one English job posting
    (Danish labour agency HOUSE ads or StackOverflow TECH ads), one sentence per line.
  how_gold_was_made: Domain-expert annotators marked every SKILL span (abilities to apply knowledge, including
    soft skills/attitudes and the job's duties) and every KNOWLEDGE span (tools, technologies, fields,
    certificates) in whole postings, following the paper's Appendix B guidelines (ESCO definitions). Test
    postings were annotated by three annotators and majority-voted (Fleiss kappa 0.70-0.75); train and
    dev postings by one annotator.
  known_issues:
  - 'The ''skills'' list is not ''requirements'': annotators tag every skill the employee is expected
    to apply, so duties (''Provide your patients with a safe and effective course of treatment'') count
    as items alongside stated requirements and soft skills. Prompts must ask for skills/competences mentioned,
    not ''requirements''.'
  - The 'knowledge' list covers tools, technologies, languages, fields and certificates (Python, AWS,
    English, gynaecology); guideline rule 13 also tags industries/fields, which are not always obvious
    named entities.
  - By guideline, skills/knowledge in the posting title, in job/position names ('Experienced Java Engineer'
    is untagged) and in text that describes only the company are NOT tagged, so a model may list such
    mentions and be scored as padding. Windows containing the posting's first row carry flag title_untagged_by_guideline.
  - Train and dev postings were single-annotated (flag single_annotator); missed spans there mean a true
    item can be absent from gold, including in n = 0 windows.
  - The released text is de-identified with placeholders (<ORGANIZATION>, <LOCATION>, <NAME>, <CONTACT>,
    <ADDRESS>, <SALARY>, ...); some gold knowledge spans are or contain a placeholder (flags anonymised_placeholders,
    gold_contains_placeholder, gold_is_placeholder).
  - The source tokenisation removed most commas ('Be good humoured loyal dedicated and flexible .'), and
    the sentence splitter sometimes breaks mid-sentence ('approx .' / '2,800 operations'); the rebuilt
    text keeps both as released.
  - HOUSE text contains cp1252 characters stored as C1 control code points (\x92 for an apostrophe, \x95
    for a bullet); the loader re-decodes them to the intended characters (flag cp1252_mojibake_repaired).
    Windows containing \x1a (a lost character) are dropped.
  - Some boilerplate sentences recur across postings of the same employer with different tags; windows
    with such a sentence carry flag boilerplate_tag_inconsistent.
