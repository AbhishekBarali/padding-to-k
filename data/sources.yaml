    path: gt/validation-00000-of-00001-cc3c5779fe22e8ca.ground_truth.jsonl
    parquet_lfs_sha256: 0d0f6dac11fdcc549de2746aa9f53136a3bc22a2a1aff2b0b847f7622ad60c15
    parquet_size: 242080800
    note: range-read of the ground_truth column only; sha256 is of the extracted JSONL
  unit_description: One Indonesian shop or restaurant receipt, rebuilt as plain text from the annotated
    OCR words (menu, subtotal and total area only).
  how_gold_was_made: Clova AI annotators drew word boxes on each receipt photo, typed the text, and labelled
    every word with a class (menu.nm, menu.cnt, menu.price, total.total_price ...), grouping the words
    of one purchased item with a shared group id. Gold here is the menu.nm text of each item group, i.e.
    the item names in the published gt_parse.menu list.
  known_issues:
  - Store name, address and payment details were removed by the dataset authors for legal reasons, so
    texts are only the item / total block and are short.
  - Sub-items (toppings, modifiers, set contents; menu.sub.nm) are printed as their own lines but are
    not gold items; units carrying them are flagged has_sub_items.
  - Text is OCR-like (abbreviations, typos such as CHIKEN, split words) because it is the annotators'
    transcription of a photo.
  - Reading order comes from the annotated rows; a visual line annotated as two rows becomes two text
    lines.
  - Printed item-count / total-quantity fields (total.menuqty_cnt, total.menutype_cnt) were removed from
    the text (flag count_leak_stripped); a few unlabelled count-like strings may remain (flag possible_count_leak_unlabelled).
  - Discounted, free (price 0) and voided lines stay in the text; free items are still gold because annotators
    labelled them menu.nm.
fewnerd:
  title: Few-NERD
  domain: wiki
  list_types:
  - people
  url: https://github.com/thunlp/Few-NERD
  paper: 'Ding, Xu, Chen, Wang, Han, Xie, Zheng and Liu (2021). Few-NERD: A Few-shot Named Entity Recognition
    Dataset. ACL-IJCNLP 2021, pages 3198-3213. https://aclanthology.org/2021.acl-long.248'
  licence: CC-BY-SA-4.0
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/
  licence_quote: Few-NERD dataset is distributed under the CC BY-SA 4.0 license. The code is distributed
    under the Apache 2.0 license.
  redistributable: true
  files:
  - url: https://huggingface.co/datasets/DFKI-SLT/few-nerd/resolve/205f3e9c9f3577ea2561d43f2f62dc249ab92d5b/supervised/test-00000-of-00001.parquet
    sha256: b7ad746fcbeb68fcc235ba7142d7c3723ea2dc39930089e947284defecf300c6
    path: supervised/test-00000-of-00001.parquet
  unit_description: One English Wikipedia sentence from the Few-NERD supervised test set.
  how_gold_was_made: '70 trained annotators and 10 experts labelled every entity in Wikipedia paragraphs
    with 8 coarse and 66 fine types: "Each paragraph is independently annotated by two well-trained annotators.
    Then, an experienced expert goes over the paragraph for possible wrong or omissive annotations, and
    make the final decision." Gold items here are the distinct strings of the person-* spans in the sentence.'
  known_issues:
  - 'Sentences only: Few-NERD has no article or paragraph id and the sentences are shuffled, so no multi-sentence
    windows can be built. Each sentence is its own group, so two sentences from the same article may land
    in different splits.'
  - Few-NERD uses IO tags, so two person names written directly next to each other merge into one span;
    spans that contain a comma, 'and', '&' or ';' are flagged io_span_has_separator.
  - 'Text is rebuilt from tokens: spaces are removed before closing punctuation and clitics and after
    opening brackets, and PTB quote tokens (`` and '''') become a straight double quote (flags tokens_joined,
    ptb_quotes_to_ascii).'
  - 'Gold counts distinct strings: a repeated name counts once (flag gold_dedup); a short form and a long
    form of what may be the same person (''Smith'', ''John Smith'') are both kept and flagged same_person_multiple_forms.'
  - Name variants of one person that are not substrings of each other ('Jean de Cabannes', 'Jean de Cabanes')
    count as separate items; names sharing a word (also relatives such as 'John Smith', 'Mary Smith')
    are flagged names_share_token for the human check.
  - 'Pronouns (he, she, his, her) are not entities. n = 0 sentences with such pronouns are flagged pronoun_person_reference_present:
    a model might list the pronoun''s referent.'
  - Few-NERD has some annotation noise (reported sentence-level accuracy >= 95% per batch, Cohen's kappa
    76.44%).
  - Fictional characters, gods and groups follow Few-NERD's typing (gods are other-god, bands are organization-showorganization),
    so they are not gold people.
maccrobat:
  title: MACCROBAT2020
  domain: clinical
  list_types:
  - symptoms
  - medications
  url: https://doi.org/10.6084/m9.figshare.9764942.v2
  paper: Caufield, J. Harry (2019). MACCROBAT. figshare. Dataset. https://doi.org/10.6084/m9.figshare.9764942.v2
    ; annotation scheme described in Caufield J.H. et al. (2019), A comprehensive typing system for information
    extraction from clinical narratives, medRxiv 10.1101/19009118
  licence: CC-BY-4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  licence_quote: 'figshare article 9764942 v2 licence field: "CC BY 4.0" (https://creativecommons.org/licenses/by/4.0/)'
  redistributable: true
  files:
  - url: https://ndownloader.figshare.com/files/21489405
    sha256: a2d34ccd1a605d9147fc7368293e61dcf2090357b26f7bce6c2b3d257204acc6
    path: MACCROBAT2020.zip
  unit_description: A window of 3 to 8 consecutive sentences (40 to 300 words) from one published clinical
    case report, with either the patient's annotated signs/symptoms or the medications annotated in that
    window.
  how_gold_was_made: The dataset author's team annotated all 200 case reports by hand in brat ("All annotations
    were created manually", figshare description) with a 24+ type clinical event scheme, including Sign_symptom
    and Medication entities and a POLARITY attribute for negated or uncertain events. The loader lists
    the Sign_symptom or Medication spans inside a window, minus negated, hedged and other-person mentions.
  known_issues:
  - Literature-style case reports, not chart notes; the text was cut down to the case details by the dataset
    author.
  - Sign_symptom also covers findings and disease-like terms (mass, lesion, tumor, metastasis, recurrence)
    and some states (healthy, asymptomatic, recovered); flagged as non_symptom_item.
  - Medication includes generic classes and procedures (chemotherapy, antibiotics, medication, sedation,
    general anesthesia); flagged as generic_item.
  - Negation comes only from the annotators' POLARITY attribute; a negated mention they did not mark would
    still be gold.
  - Inter-annotator agreement for MACCROBAT is not reported on the figshare page (not verified).
  - Windows from one report overlap; the build must use group to keep one report in one split.
mailex:
  title: 'MailEx: Email Event and Argument Extraction'
  domain: emails
  list_types:
  - requests
  url: https://github.com/salokr/Email-Event-Extraction
  paper: 'Saurabh Srivastava, Gaurav Singh, Shou Matsumoto, Ali Raz, Paulo Costa, Joshua Poore, Ziyu Yao.
    MailEx: Email Event and Argument Extraction. EMNLP 2023. ACL Anthology 2023.emnlp-main.801, arXiv
    2305.13469.'
  licence: CC-BY-SA-4.0
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/legalcode
  licence_quote: The dataset is distributed under the [CC BY-SA 4.0 license](https://creativecommons.org/licenses/by-sa/4.0/legalcode).
  redistributable: true
  files:
  - url: https://drive.google.com/uc?export=download&id=1a336g4-wlEwsVbXLPB9wPQnBDRE933mb
    sha256: dda3ce5da5ffc3452dd9e5a58cd69e19e68bd655eafe1deec48e87204f6c37b4
    path: mailex.zip
  unit_description: 'One Enron business email (one message of a MailEx thread): its subject line and body.'
  how_gold_was_made: Two native English-speaking Computer Science students annotated every email of 1,500
    Enron threads with event triggers and argument spans (10 event types), seeing the earlier thread messages
    as context; instances where the two annotators disagreed on type or had no trigger overlap were deleted.
    Gold items here are the Request_* event instances (Request_Action, Request_Data, Request_Meeting,
    Request_Action_Data, Request_Meeting_Data), one item per instance, text = trigger span joined with
    the instance's head argument span.
  known_issues:
  - Disputed annotations were deleted by the authors, so an email with gold n=0 (or n=k) can still contain
    a real, unlabelled request; such n=0 emails are flagged maybe_missing_item:request_cue.
  - Gold item text is a span we cut from the annotators' trigger and head-argument spans; it is extractive
    but its exact boundaries are our rule, so scoring should be fuzzy.
  - Annotators read the whole thread; some requests only read as requests with that context (e.g. a bare
    follow-up question).
  - The subject line is shown to the model but was never annotated.
  - Request_Action_Data and some Request_Data instances are questions or offers ('Would you like me to
    forward ...?'), which a reader may not call a request.
  - Enron emails are real people's private correspondence (names, phone numbers); the underlying CMU Enron
    corpus states no licence.
