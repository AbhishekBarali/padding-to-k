# Checks that need no GPU, API keys or downloads: the frozen files still match their registered
# hashes, and the test suites pass. Rebuilding the paper's tables (about 3 minutes) is left to
# the README, so a push stays quick.
name: checks

on:
  push:
    branches: [release]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Frozen files match the registered hashes
        run: python tools/check_frozen.py
      - name: Tests
        run: python -m pytest harness/tests analysis/tests analysis/posthoc/tests tools/tests
